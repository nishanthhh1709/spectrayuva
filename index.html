<style>
html{scroll-behavior:smooth}
body{margin:0;background:#150833}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.site{--nav:64px;width:100%;max-width:1600px;margin:0 auto;font-family:'Quicksand',sans-serif;color:#FFF3D6;background:#150833;overflow-x:hidden}
.nav{position:sticky;top:0;z-index:50;min-height:var(--nav);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 24px;padding:0 clamp(16px,4vw,48px);background:rgba(21,8,51,.94);border-bottom:1px solid rgba(224,176,80,.55);backdrop-filter:blur(8px)}

.mrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(224,176,80,.3);font-size:16px;line-height:1.5}

<script type="text/x-dc" data-dc-script data-props='{"eventTime":{"editor":"text","default":"00:00"},"$preview":{"width":1360,"height":1000}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this._t) clearInterval(this._t);
    this._t = setInterval(() => this.setState({ tick: Math.floor(Date.now() / 1000) }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this._t);
    this._t = null;
  }
  renderVals() {
    // Single countdown, derived from the real clock (IST = UTC+5:30). Target: 15 Dec 2026 at eventTime (IST).
    const IST = 19800000;
    const tm = /^(\d{1,2}):(\d{2})$/.exec(String(this.props.eventTime ?? '00:00').trim());
    const hh = tm ? Math.min(23, +tm[1]) : 0;
    const mm = tm ? Math.min(59, +tm[2]) : 0;
    const target = Date.UTC(2026, 11, 15, hh, mm, 0);
    const nowIst = Date.now() + IST;
    let count = [];
    let live = false;
    if (nowIst < target) {
      live = true;
      const d = new Date(nowIst);
      const mk = (m) => Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + m, d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
      const t = new Date(target);
      let m = (t.getUTCFullYear() - d.getUTCFullYear()) * 12 + (t.getUTCMonth() - d.getUTCMonth());
      while (m > 0 && mk(m) > target) m--;
      m = Math.max(0, m);
      const s = Math.floor(Math.max(0, target - mk(m)) / 1000);
      const p = (x) => String(x).padStart(2, '0');
      count = [
        { n: p(m), l: 'Months' },
        { n: p(Math.floor(s / 86400)), l: 'Days' },
        { n: p(Math.floor(s / 3600) % 24), l: 'Hours' },
        { n: p(Math.floor(s / 60) % 60), l: 'Minutes' },
        { n: p(s % 60), l: 'Seconds' }
      ];
    }
    return { count, live, over: !live };
  }
}
</script>
